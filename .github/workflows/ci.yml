name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.2', '3.3', '3.4']
        faraday-version: ['']
        include:
          # fastlane 2.237.0 and earlier use Faraday 1
          - ruby-version: '3.2'
            faraday-version: '~> 1.10'
    name: Ruby ${{ matrix.ruby-version }}${{ matrix.faraday-version && format(', Faraday {0}', matrix.faraday-version) || '' }}
    env:
      FARADAY_VERSION: ${{ matrix.faraday-version }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run specs
        run: bundle exec rspec

      - name: Run RuboCop
        run: bundle exec rubocop
